name: Podcatcher CI

# Verification for the Podcatcher fork's custom features. GitHub-hosted ubuntu runners
# ship the Android SDK and 16 GB RAM, so they can run the app's normal Gradle build/tests
# (the ~8 GB Gradle heap fits) even though local web sessions cannot.

on:
  push:
    branches:
      - "claude/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: podcatcher-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Spotless + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check formatting
        run: ./gradlew spotlessCheck --stacktrace

      - name: Unit tests (model + player)
        run: >-
          ./gradlew
          :modules:services:model:testDebugUnitTest
          :modules:features:player:testDebugUnitTest
          --stacktrace
